name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major
      release_notes:
        description: 'Custom release notes (optional)'
        required: false
        type: string

env:
  NODE_VERSION: '18'

jobs:
  # ===========================================
  # CREATE RELEASE
  # ===========================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Determine version
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          # Tagged release
          VERSION=${GITHUB_REF#refs/tags/v}
          TAG=${GITHUB_REF#refs/tags/}
        else
          # Manual release
          VERSION_TYPE="${{ github.event.inputs.version_type || 'patch' }}"

          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./solix-edg/package.json').version")

          # Calculate new version
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}

          case $VERSION_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          VERSION="$MAJOR.$MINOR.$PATCH"
          TAG="v$VERSION"
        fi

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT

        echo "Creating release $TAG ($VERSION)"

    - name: Update package.json version
      if: github.event_name == 'workflow_dispatch'
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        cd solix-edg

        # Update root package.json
        npm version $VERSION --no-git-tag-version

        # Update service package.json files
        for service in frontend metadata-service policy-service workflow-service alerts-service integration-service ai-service reverse-sync-service; do
          if [ -d "$service" ]; then
            cd $service
            npm version $VERSION --no-git-tag-version
            cd ..
          fi
        done

    - name: Generate changelog
      id: changelog
      run: |
        cd solix-edg

        # Get previous tag
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

        if [ -n "$PREVIOUS_TAG" ]; then
          # Generate changelog from commits since last tag
          CHANGELOG=$(git log --pretty=format:"* %s (%h)" --no-merges $PREVIOUS_TAG..HEAD)
        else
          # First release
          CHANGELOG=$(git log --pretty=format:"* %s (%h)" --no-merges)
        fi

        # Escape newlines for GitHub output
        CHANGELOG="${CHANGELOG//'%'/'%25'}"
        CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
        CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"

        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create GitHub release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        release_name: Release ${{ steps.version.outputs.tag }}
        body: |
          ## 🚀 Release ${{ steps.version.outputs.tag }}

          ${{ github.event.inputs.release_notes || 'Automated release created by CI/CD pipeline.' }}

          ### Changes
          ${{ steps.changelog.outputs.changelog }}

          ### Deployment
          - **Environment**: Production
          - **Status**: ✅ Successfully deployed
          - **Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ### Verification
          - ✅ All tests passed
          - ✅ Security scans completed
          - ✅ Performance checks passed
          - ✅ Accessibility compliant
          - ✅ Code quality gates passed

          ### Installation
          ```bash
          # Using npm
          npm install solix-edg@${{ steps.version.outputs.version }}

          # Using Docker
          docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
          ```

          ### Documentation
          📖 [View Full Documentation](https://docs.solix-edg.com)

          ---
          *This release was automatically created and deployed by the CI/CD pipeline.*
        draft: false
        prerelease: false

  # ===========================================
  # BUILD AND PUBLISH PACKAGES
  # ===========================================
  publish-packages:
    name: Publish Packages
    runs-on: ubuntu-latest
    needs: create-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci
      working-directory: solix-edg

    - name: Build packages
      run: npm run build:all
      working-directory: solix-edg

    - name: Publish to NPM
      run: npm publish --access public
      working-directory: solix-edg
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Publish service packages
      run: |
        cd solix-edg

        # Publish each service package
        for service in metadata-service policy-service workflow-service alerts-service integration-service ai-service reverse-sync-service; do
          if [ -d "$service" ]; then
            echo "Publishing $service"
            cd $service
            npm publish --access public
            cd ..
          fi
        done
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ===========================================
  # BUILD AND PUBLISH DOCKER IMAGES
  # ===========================================
  publish-docker:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: create-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=tag
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./solix-edg
        file: ./solix-edg/infrastructure/docker/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    - name: Generate SBOM
      run: |
        docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }} --format json > sbom.json

    - name: Upload SBOM
      uses: actions/upload-artifact@v3
      with:
        name: sbom
        path: sbom.json

  # ===========================================
  # UPDATE DOCUMENTATION
  # ===========================================
  update-docs:
    name: Update Documentation
    runs-on: ubuntu-latest
    needs: create-release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install dependencies
      run: npm ci
      working-directory: solix-edg/docs

    - name: Build documentation
      run: npm run build
      working-directory: solix-edg/docs

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: solix-edg/docs/build
        cname: docs.solix-edg.com

  # ===========================================
  # NOTIFY STAKEHOLDERS
  # ===========================================
  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [create-release, publish-packages, publish-docker, update-docs]
    if: always()

    steps:
    - name: Send Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
        title: '🚀 New OpenGovern Release: ${{ steps.version.outputs.tag }}'
        text: |
          *Release ${{ steps.version.outputs.tag }}* has been published!

          📦 **NPM Packages**: Published to npm registry
          🐳 **Docker Images**: Available on GHCR
          📚 **Documentation**: Updated at https://docs.solix-edg.com
          🔒 **SBOM**: Security bill of materials generated

          View release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Send email notification
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: '🚀 OpenGovern Release ${{ steps.version.outputs.tag }} Published'
        body: |
          ## New Release Published

          **Version**: ${{ steps.version.outputs.tag }}
          **Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Repository**: ${{ github.repository }}

          ### What's New
          ${{ github.event.inputs.release_notes || 'See release notes for details.' }}

          ### Downloads
          - 📦 **NPM**: https://www.npmjs.com/package/solix-edg/v/${{ steps.version.outputs.version }}
          - 🐳 **Docker**: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
          - 📚 **Docs**: https://docs.solix-edg.com

          ### Release Notes
          ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}

          ---
          *This is an automated notification from the CI/CD pipeline.*
        to: releases@solix-edg.com, devops@solix-edg.com
        from: Releases <releases@solix-edg.com>

    - name: Create GitHub issue for release follow-up
      uses: actions/github-script@v6
      with:
        script: |
          const version = '${{ steps.version.outputs.version }}';
          const tag = '${{ steps.version.outputs.tag }}';

          // Create follow-up issue
          const issue = await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `📋 Release ${tag} Follow-up Tasks`,
            body: `## Release ${tag} Follow-up

This issue tracks post-release activities for version ${version}.

### Checklist
- [ ] Update marketing website with new features
- [ ] Send release announcement to mailing list
- [ ] Update changelog in documentation
- [ ] Create blog post about new features
- [ ] Update roadmap with completed items
- [ ] Monitor error rates and performance metrics
- [ ] Plan next release cycle

### Release Summary
- **Version**: ${version}
- **Tag**: ${tag}
- **Date**: ${new Date().toISOString().split('T')[0]}
- **Release URL**: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${tag}

### Key Changes
${{ steps.changelog.outputs.changelog }}

---
*Auto-generated by release workflow*`,
            labels: ['release-followup', 'documentation']
          });