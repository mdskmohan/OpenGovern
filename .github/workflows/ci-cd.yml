name: CI/CD Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================
  # LINT AND TEST
  # ===========================================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, metadata-service, policy-service, workflow-service, alerts-service, integration-service, ai-service, reverse-sync-service]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          OpenEDG/package.json
          OpenEDG/${{ matrix.service }}/package.json

    - name: Install root dependencies
      run: npm ci
      working-directory: OpenEDG

    - name: Install service dependencies
      run: npm ci
      working-directory: OpenEDG/${{ matrix.service }}

    - name: Run linting
      run: npm run lint
      working-directory: OpenEDG/${{ matrix.service }}

    - name: Run type checking
      run: npm run type-check
      working-directory: OpenEDG/${{ matrix.service }}

    - name: Run tests
      run: npm run test:ci
      working-directory: OpenEDG/${{ matrix.service }}
      env:
        CI: true

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./OpenEDG/${{ matrix.service }}/coverage/lcov.info
        flags: ${{ matrix.service }}
        name: ${{ matrix.service }}
        fail_ci_if_error: false

  # ===========================================
  # SECURITY SCANNING
  # ===========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Run npm audit
      run: npm audit --audit-level=moderate
      working-directory: OpenEDG
      continue-on-error: true

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './OpenEDG'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # ===========================================
  # BUILD AND TEST DOCKER IMAGES
  # ===========================================
  build-and-test:
    name: Build & Test Docker
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker images
      uses: docker/build-push-action@v5
      with:
        context: ./OpenEDG
        file: ./OpenEDG/infrastructure/docker/Dockerfile
        push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Docker Compose tests
      run: |
        cd OpenEDG/infrastructure/docker
        docker-compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from test
      env:
        CI: true

  # ===========================================
  # INTEGRATION TESTS
  # ===========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: solix_edg_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install dependencies
      run: npm ci
      working-directory: OpenEDG

    - name: Run database migrations
      run: npm run db:migrate
      working-directory: OpenEDG
      env:
        DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/solix_edg_test

    - name: Run integration tests
      run: npm run test:integration
      working-directory: OpenEDG
      env:
        DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/solix_edg_test
        REDIS_URL: redis://localhost:6379
        CI: true

  # ===========================================
  # E2E TESTS
  # ===========================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install Playwright
      run: npx playwright install
      working-directory: OpenEDG/frontend

    - name: Run E2E tests
      run: npm run test:e2e
      working-directory: OpenEDG/frontend
      env:
        CI: true

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: playwright-report
        path: OpenEDG/frontend/playwright-report/
        retention-days: 30

  # ===========================================
  # DEPLOYMENT
  # ===========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-tests, e2e-tests]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy to ECS
      run: |
        aws ecs update-service --cluster OpenEDG-staging --service OpenEDG-service --force-new-deployment

    - name: Run health checks
      run: |
        # Wait for deployment to complete
        aws ecs wait services-stable --cluster OpenEDG-staging --services OpenEDG-service

        # Run health checks
        curl -f https://staging.solix-edg.com/api/health || exit 1

    - name: Run smoke tests
      run: |
        npm run test:smoke -- --env staging
      working-directory: solix-edg

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-tests, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy to ECS
      run: |
        aws ecs update-service --cluster solix-edg-prod --service solix-edg-service --force-new-deployment

    - name: Run health checks
      run: |
        # Wait for deployment to complete
        aws ecs wait services-stable --cluster solix-edg-prod --services solix-edg-service

        # Run health checks
        curl -f https://solix-edg.com/api/health || exit 1

    - name: Run smoke tests
      run: |
        npm run test:smoke -- --env production
      working-directory: solix-edg

    - name: Create GitHub release
      if: success()
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          ## Changes
          - Automated deployment to production
          - All tests passed
          - Health checks successful

          ## Deployment Details
          - Environment: Production
          - Cluster: solix-edg-prod
          - Service: solix-edg-service
        draft: false
        prerelease: false

  # ===========================================
  # NOTIFICATION
  # ===========================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan, build-and-test, integration-tests, e2e-tests]
    if: always()

    steps:
    - name: Send Slack notification
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Send email notification
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: OpenGovern CI/CD Pipeline Failed
        body: |
          The CI/CD pipeline has failed for OpenGovern.

          Repository: ${{ github.repository }}
          Branch: ${{ github.ref }}
          Commit: ${{ github.sha }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Please check the logs for more details.
        to: devops@solix-edg.com
        from: CI/CD Pipeline <cicd@solix-edg.com>