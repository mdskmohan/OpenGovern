name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Type of update to perform'
        required: true
        default: 'minor'
        type: choice
        options:
        - patch
        - minor
        - major

env:
  NODE_VERSION: '18'

jobs:
  # ===========================================
  # UPDATE DEPENDENCIES
  # ===========================================
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install root dependencies
      run: npm ci
      working-directory: OpenEDG

    - name: Update dependencies
      run: |
        cd OpenEDG

        # Update all dependencies based on input or default to minor
        UPDATE_TYPE="${{ github.event.inputs.update_type || 'minor' }}"

        case $UPDATE_TYPE in
          patch)
            npm update --save
            ;;
          minor)
            npx npm-check-updates -u --target minor
            ;;
          major)
            npx npm-check-updates -u --target latest
            ;;
        esac

        # Update lockfile
        npm install

    - name: Update service dependencies
      run: |
        cd OpenEDG

        # Update dependencies for each service
        for service in frontend metadata-service policy-service workflow-service alerts-service integration-service ai-service reverse-sync-service; do
          if [ -d "$service" ]; then
            echo "Updating dependencies for $service"
            cd $service

            UPDATE_TYPE="${{ github.event.inputs.update_type || 'minor' }}"

            case $UPDATE_TYPE in
              patch)
                npm update --save
                ;;
              minor)
                npx npm-check-updates -u --target minor
                ;;
              major)
                npx npm-check-updates -u --target latest
                ;;
            esac

            npm install
            cd ..
          fi
        done

    - name: Run tests after updates
      run: |
        cd OpenEDG
        npm run test:all
      env:
        CI: true

    - name: Create pull request
      if: success()
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: |
          chore: update dependencies (${{ github.event.inputs.update_type || 'minor' }})

          - Updated all dependencies to latest ${{ github.event.inputs.update_type || 'minor' }} versions
          - Ran full test suite to ensure compatibility
          - Auto-generated by dependency update workflow
        title: 'chore: update dependencies (${{ github.event.inputs.update_type || 'minor' }})'
        body: |
          ## Dependency Updates

          This PR updates all project dependencies to their latest ${{ github.event.inputs.update_type || 'minor' }} versions.

          ### Changes
          - Updated root package dependencies
          - Updated all service dependencies
          - Regenerated package-lock.json files

          ### Testing
          - All tests pass after updates
          - No breaking changes detected

          ### Review Checklist
          - [ ] Review dependency changes for security implications
          - [ ] Check for any breaking changes in updated packages
          - [ ] Verify all services start correctly
          - [ ] Test critical user flows

          Auto-generated by [Dependency Update Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
        branch: automated/dependency-updates
        delete-branch: true
        labels: |
          dependencies
          automated
        assignees: ${{ github.actor }}

  # ===========================================
  # SECURITY UPDATES
  # ===========================================
  security-updates:
    name: Security Updates
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      working-directory: OpenEDG

    - name: Run security audit
      run: npm audit --audit-level=moderate
      working-directory: OpenEDG
      continue-on-error: true

    - name: Fix security vulnerabilities
      run: |
        cd OpenEDG

        # Try to fix vulnerabilities automatically
        npm audit fix --audit-level=moderate

        # Update services
        for service in frontend metadata-service policy-service workflow-service alerts-service integration-service ai-service reverse-sync-service; do
          if [ -d "$service" ]; then
            echo "Fixing security issues in $service"
            cd $service
            npm audit fix --audit-level=moderate
            cd ..
          fi
        done

    - name: Run tests after security fixes
      run: |
        cd solix-edg
        npm run test:all
      env:
        CI: true

    - name: Create security update PR
      if: success()
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: |
          security: fix security vulnerabilities

          - Applied automatic security fixes
          - Updated vulnerable dependencies
          - Ran full test suite to ensure compatibility
          - Auto-generated by security update workflow
        title: 'security: fix security vulnerabilities'
        body: |
          ## Security Updates

          This PR addresses security vulnerabilities found in dependencies.

          ### Changes
          - Applied `npm audit fix` to address moderate and high severity issues
          - Updated vulnerable packages across all services
          - Regenerated package-lock.json files

          ### Security Audit Results
          ```
          $(cd solix-edg && npm audit --audit-level=moderate --json | jq -r '.metadata.vulnerabilities // empty')
          ```

          ### Testing
          - All tests pass after security fixes
          - No functionality regressions detected

          ### Review Checklist
          - [ ] Review security advisory details
          - [ ] Verify fixes address all reported vulnerabilities
          - [ ] Check for any breaking changes
          - [ ] Test critical security-related features

          Auto-generated by [Security Update Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
        branch: automated/security-updates
        delete-branch: true
        labels: |
          security
          automated
        assignees: ${{ github.actor }}

  # ===========================================
  # NOTIFICATION
  # ===========================================
  notify-updates:
    name: Notify Updates
    runs-on: ubuntu-latest
    needs: [update-dependencies, security-updates]
    if: always()

    steps:
    - name: Send Slack notification
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Send email notification
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: OpenGovern Dependency Updates Failed
        body: |
          The automated dependency update workflow has failed for OpenGovern.

          Repository: ${{ github.repository }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Please check the logs for more details and manually review dependency updates.
        to: devops@opengovern.com
        from: CI/CD Pipeline <cicd@opengovern.com>